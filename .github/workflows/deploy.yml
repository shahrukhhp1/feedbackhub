name: Deploy via FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ftp-deploy
  cancel-in-progress: true

env:
  # Repo layout: app lives in feedbackhub/ (override with repository variable APP_ROOT).
  APP_ROOT: ${{ vars.APP_ROOT || 'feedbackhub' }}
  # FTP upload target (override with repository variable FTP_SERVER_DIR).
  FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR || './' }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
          package_json_file: ${{ env.APP_ROOT }}/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ env.APP_ROOT }}/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ${{ env.APP_ROOT }}
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: ${{ env.APP_ROOT }}
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        run: pnpm build

      - name: Prepare standalone bundle
        working-directory: ${{ env.APP_ROOT }}
        run: bash scripts/prepare-standalone.sh

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ${{ env.APP_ROOT }}/deploy/
          server-dir: ${{ env.FTP_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
