name: Core flow integration

on:
  workflow_dispatch:

jobs:
  core-flow-integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: feedback_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d feedback_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/feedback_test
      DATABASE_URL: postgresql://test:test@localhost:5432/feedback_test
      APP_BASE_URL: http://localhost:3000
      AUTH_SECRET: ci-test-auth-secret-must-be-32-chars-min

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.14.0
          package_json_file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Core flow integration tests
        run: pnpm test:integration:core
